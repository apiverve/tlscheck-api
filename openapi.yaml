openapi: 3.0.4
info:
  title: TLS Checker
  description: >-
    TLS Checker tests which TLS protocol versions a server accepts by running a
    live handshake for each of TLS 1.0, 1.1, 1.2 and 1.3. It reports the highest
    version, the cipher the server picks, whether the certificate validates,
    whether deprecated protocols are still exposed, a risk score and a letter
    grade from a published rubric.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/tlscheck:
    get:
      summary: TLS Checker
      description: >-
        Runs a TLS handshake at each protocol version (TLS 1.0 to 1.3) against a
        domain and port, and reports which versions are accepted, the cipher
        negotiated at the highest version, whether the certificate validates,
        and a graded security verdict.
      operationId: tlscheck
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: The domain to check the TLS/SSL configuration for
          example: amazon.com
        - name: port
          in: query
          schema:
            type: integer
          required: false
          description: The port to connect to (usually 443 for HTTPS)
          example: 443
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: amazon.com
                  tlsVersions:
                    TLSv1: false
                    TLSv1.1: false
                    TLSv1.2: true
                    TLSv1.3: true
                  highestVersion: TLSv1.3
                  negotiatedCipher: TLS_AES_256_GCM_SHA384
                  forwardSecrecy: true
                  certificateTrusted: true
                  certificateError: null
                  hasDeprecatedTLS: false
                  isSecure: true
                  riskScore: 0
                  riskLevel: low
                  grade: A+
                  gradeReasons: []
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
